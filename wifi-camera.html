<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WiFi Camera | Guru CCTV Security</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: white;
      line-height: 1.6;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      padding: 25px 0;
      text-align: center;
      background: #0d1b2e;
    }

    header h1 {
      color: #00c6ff;
      margin-bottom: 8px;
    }

    header p {
      color: #aebfd1;
    }

    .product {
      padding: 50px 0;
    }

    .product h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 34px;
    }

    .description {
      text-align: center;
      color: #aebfd1;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 45px;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      display: block;
      background: #102137;
    }

    .videos h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    .back {
      text-align: center;
      margin: 45px 0;
    }

    .back a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: #1687ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .gallery,
      .video-grid {
        grid-template-columns: 1fr;
      }

      .product h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1>Guru CCTV Security</h1>
      <p>WiFi Camera</p>
    </div>
  </header>

  <section class="product">
    <div class="container">

      <h2>WiFi Camera</h2>

      <p class="description">
        Smart WiFi Camera with remote monitoring,
        clear video quality and modern security features.
      </p>

      <!-- PHOTOS -->

      <div class="gallery">

        <img src="./wifi-cam.jpeg"
             alt="WiFi Camera">

        <img src="./dual-lens-wifi-cam.jpeg"
             alt="Dual Lens WiFi Camera">

      </div>

      <!-- VIDEOS -->

      <div class="videos">

        <h2>Product Videos</h2>

        <div class="video-grid">

          <video controls>
            <source src="./wifi-cam-video-1.mp4" type="video/mp4">
          </video>

          <video controls>
            <source src="./wifi-cam-video-2.mp4" type="video/mp4">
          </video>

          <video controls>
            <source src="./wifi-cam-video-3.mp4" type="video/mp4">
          </video>

        </div>

      </div>

      <div class="back">
        <a href="./index.html">← Back to Products</a>
      </div>

    </div>
  </section>

</body>
</html>
